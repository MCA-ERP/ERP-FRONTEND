<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-char {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: 0.18em;
        fill: #111827;
      }
    </style>
  </defs>

  <!-- M Box - Growth Green #0A7F5B -->
  <rect x="20" y="24" width="86" height="86" rx="14" fill="#0A7F5B" />
  <text x="63" y="68" font-size="52" class="brand-char">M</text>

  <!-- C Box - Class Blue #0294CE -->
  <rect x="114" y="24" width="86" height="86" rx="14" fill="#0294CE" />
  <text x="157" y="68" font-size="52" class="brand-char">C</text>

  <!-- A Box - Assist Red #E53A35 with Growth Arrow -->
  <rect x="208" y="24" width="86" height="86" rx="14" fill="#E53A35" />
  <text x="251" y="68" font-size="52" class="brand-char">A</text>
  
  <!-- Growth Arrow on A Box (Top-Right) -->
  <path d="M 276 14 L 302 14 L 302 40 L 293 40 L 293 27 L 273 47 L 267 41 L 287 21 L 276 21 Z" fill="#E53A35" />

  <!-- Subtitle Text: MY CLASS ASSIST -->
  <text x="160" y="142" font-size="21" class="brand-title" text-anchor="middle">MY CLASS ASSIST</text>
</svg>

