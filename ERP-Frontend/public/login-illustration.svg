<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FCE0DF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D9EFE8" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#583B92" />
      <stop offset="100%" stop-color="#3F2B68" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0294CE" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <ellipse cx="300" cy="270" rx="220" ry="140" fill="url(#cloudBg)" filter="url(#softGlow)" />

  <!-- Floating Digital / Education Badges & Icons -->
  <!-- Cloud Icon -->
  <g transform="translate(185, 140)">
    <rect width="32" height="32" rx="10" fill="#E0F2FE" />
    <path d="M11 20a4 4 0 0 1-1-7.87 5 5 0 0 1 9.5-1.5 3.5 3.5 0 0 1 3.5 3.37A4 4 0 0 1 21 20H11z" fill="#0294CE" />
  </g>

  <!-- Heart / Care Icon -->
  <g transform="translate(155, 185)">
    <rect width="28" height="28" rx="8" fill="#FCE0DF" />
    <path d="M14 20.5l-1.16-1.05C8.72 15.7 6 13.24 6 10.2A4.2 4.2 0 0 1 10.2 6c1.36 0 2.67.63 3.8 1.62A5.1 5.1 0 0 1 17.8 6 4.2 4.2 0 0 1 22 10.2c0 3.04-2.72 5.5-6.84 9.25L14 20.5z" fill="#E53A35" transform="scale(0.8) translate(3, 2)" />
  </g>

  <!-- Chat / Communication -->
  <g transform="translate(240, 115)">
    <rect width="30" height="30" rx="9" fill="#FEF3C7" />
    <path d="M7 8h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-4l-4 3v-3H7a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="#F59E0B" transform="scale(0.8) translate(3, 2)" />
  </g>

  <!-- Settings / CMS Icon -->
  <g transform="translate(340, 125)">
    <rect width="32" height="32" rx="10" fill="#E9D5FF" />
    <rect x="9" y="9" width="14" height="14" rx="3" fill="#8B5CF6" />
    <line x1="12" y1="13" x2="20" y2="13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="18" x2="17" y2="18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wifi / Connected -->
  <g transform="translate(410, 160)">
    <rect width="28" height="28" rx="8" fill="#E0F2FE" />
    <path d="M7 11a10 10 0 0 1 14 0M10 14a6 6 0 0 1 8 0M13 17a2 2 0 0 1 2 0" stroke="#0294CE" stroke-width="2" stroke-linecap="round" fill="none" transform="scale(0.8) translate(3, 3)" />
  </g>

  <!-- Notification / Megaphone -->
  <g transform="translate(435, 205)">
    <rect width="26" height="26" rx="8" fill="#D9EFE8" />
    <path d="M13 7l-5 3H5v4h3l5 3V7zm3 2a4 4 0 0 1 0 6" stroke="#0A7F5B" stroke-width="1.8" stroke-linecap="round" fill="none" transform="scale(0.75) translate(4, 4)" />
  </g>

  <!-- Central Educator Figure -->
  <!-- Hair & Head -->
  <ellipse cx="300" cy="180" rx="22" ry="26" fill="#FADBC8" />
  <path d="M276 172c0-18 10-32 24-32s24 14 24 32c-3-2-8-6-16-6s-20 4-32 6z" fill="#1E293B" />
  <!-- Beard & Hair detail -->
  <path d="M282 186c2 18 10 26 18 26s16-8 18-26c-5 3-11 5-18 5s-13-2-18-5z" fill="#1E293B" />
  <!-- Glasses -->
  <rect x="284" y="176" width="13" height="9" rx="3" fill="none" stroke="#1E293B" stroke-width="2.2" />
  <rect x="303" y="176" width="13" height="9" rx="3" fill="none" stroke="#1E293B" stroke-width="2.2" />
  <line x1="297" y1="180" x2="303" y2="180" stroke="#1E293B" stroke-width="2.2" />

  <!-- Body / Formal Suit -->
  <path d="M255 310 L268 218 C273 214 286 210 300 210 C314 210 327 214 332 218 L345 310 Z" fill="url(#suitGrad)" />
  <!-- White Shirt & Tie -->
  <polygon points="292,210 308,210 303,246 297,246" fill="#FFFFFF" />
  <polygon points="298,218 302,218 305,248 300,258 295,248" fill="#1E293B" />

  <!-- Central Educator Laptop -->
  <rect x="252" y="272" width="96" height="60" rx="7" fill="url(#laptopGrad)" stroke="#D97706" stroke-width="1.5" />
  <rect x="258" y="278" width="84" height="48" rx="4" fill="#FDE68A" />
  <!-- Laptop MCA brand tag -->
  <g transform="translate(283, 292)">
    <rect width="10" height="10" rx="2" fill="#0A7F5B" />
    <text x="5" y="8" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">M</text>
    <rect x="12" y="292" width="10" height="10" rx="2" fill="#0294CE" transform="translate(-12, -292)" />
    <text x="17" y="8" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">C</text>
    <rect x="24" y="292" width="10" height="10" rx="2" fill="#E53A35" transform="translate(-24, -292)" />
    <text x="29" y="8" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  </g>
  <rect x="238" y="330" width="124" height="6" rx="3" fill="#E2E8F0" />

  <!-- Desk Surface -->
  <line x1="80" y1="335" x2="520" y2="335" stroke="#0294CE" stroke-width="3" stroke-linecap="round" />

  <!-- Left Student (Girl with pigtails) -->
  <g transform="translate(140, 230)">
    <!-- Pigtails -->
    <circle cx="28" cy="44" r="7" fill="#E53A35" />
    <circle cx="68" cy="44" r="7" fill="#E53A35" />
    <!-- Hair -->
    <circle cx="48" cy="38" r="22" fill="#1E293B" />
    <!-- Face -->
    <ellipse cx="48" cy="42" rx="16" ry="17" fill="#FADBC8" />
    <path d="M34 38c3-8 10-14 18-14s16 4 18 12c-4-2-9-3-14-3s-15 3-22 5z" fill="#1E293B" />
    <!-- Glasses -->
    <circle cx="42" cy="43" r="5" fill="none" stroke="#E53A35" stroke-width="1.8" />
    <circle cx="54" cy="43" r="5" fill="none" stroke="#E53A35" stroke-width="1.8" />
    <line x1="47" y1="43" x2="49" y2="43" stroke="#E53A35" stroke-width="1.8" />
    <!-- Clothes -->
    <path d="M26 95 L34 62 C38 59 44 57 48 57 C52 57 58 59 62 62 L70 95 Z" fill="#E53A35" />
    <!-- Laptop -->
    <rect x="22" y="74" width="52" height="30" rx="4" fill="url(#laptopGrad)" />
    <rect x="25" y="77" width="46" height="24" rx="2" fill="#FEF3C7" />
    <rect x="15" y="103" width="66" height="3" rx="1.5" fill="#CBD5E1" />
  </g>

  <!-- Right Student (Boy with blue shirt) -->
  <g transform="translate(385, 235)">
    <!-- Hair -->
    <ellipse cx="48" cy="38" rx="21" ry="20" fill="#1E293B" />
    <!-- Face -->
    <ellipse cx="48" cy="43" rx="16" ry="17" fill="#FADBC8" />
    <path d="M34 36c4-7 11-10 18-10s16 4 18 10c-5 1-12 1-18 4s-12 3-18-4z" fill="#1E293B" />
    <!-- Clothes -->
    <path d="M26 95 L34 62 C38 59 44 57 48 57 C52 57 58 59 62 62 L70 95 Z" fill="#0A7F5B" />
    <!-- Laptop -->
    <rect x="22" y="72" width="52" height="30" rx="4" fill="url(#laptopGrad)" />
    <rect x="25" y="75" width="46" height="24" rx="2" fill="#FEF3C7" />
    <rect x="15" y="101" width="66" height="3" rx="1.5" fill="#CBD5E1" />
  </g>

  <!-- Accessories on the Desk -->
  <!-- Pencil Holder (Left) -->
  <g transform="translate(100, 290)">
    <rect x="6" y="20" width="18" height="25" rx="3" fill="#64748B" />
    <!-- Pencils -->
    <line x1="10" y1="20" x2="6" y2="5" stroke="#E53A35" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="20" x2="15" y2="2" stroke="#0294CE" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="20" x2="24" y2="7" stroke="#0A7F5B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug (Center Left) -->
  <g transform="translate(235, 298)">
    <rect x="4" y="8" width="16" height="22" rx="3" fill="#0A7F5B" />
    <path d="M20 12h3a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-3" fill="none" stroke="#0A7F5B" stroke-width="2" />
  </g>

  <!-- Stack of Books (Right) -->
  <g transform="translate(365, 304)">
    <rect x="0" y="20" width="28" height="7" rx="2" fill="#0A7F5B" />
    <rect x="2" y="13" width="26" height="7" rx="2" fill="#0294CE" />
    <rect x="4" y="6" width="24" height="7" rx="2" fill="#E53A35" />
  </g>
</svg>

